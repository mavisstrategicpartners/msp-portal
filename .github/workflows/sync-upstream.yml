name: Sync from upstream

# Keeps this fork's main branch up to date with the original repository's main.
# Upstream changes are merged in (never force-pushed), the result must build
# and pass the role checks before it is pushed, and anything that needs a
# person -- a merge conflict, a failed build, missing access -- is reported in
# a single "upstream sync" issue that closes itself once a sync succeeds.

on:
  schedule:
    - cron: "*/15 * * * *"   # check upstream every 15 minutes
  workflow_dispatch: {}        # "Run workflow" button for an immediate sync
  repository_dispatch:
    types: [upstream-updated]  # optional instant trigger from the upstream repo

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'Ririesphe/msp-portal' }}
  UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}
  TARGET_BRANCH: ${{ vars.TARGET_BRANCH || 'main' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check upstream access is configured
        id: precheck
        env:
          TOKEN: ${{ secrets.UPSTREAM_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::error::Secret UPSTREAM_REPO_TOKEN is not set. Add a read-only token for $UPSTREAM_REPOSITORY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Merge upstream into fork
        id: sync
        env:
          UPSTREAM_URL: https://x-access-token:${{ secrets.UPSTREAM_REPO_TOKEN }}@github.com/${{ env.UPSTREAM_REPOSITORY }}.git
        run: |
          git config user.name  "msp-upstream-sync[bot]"
          git config user.email "msp-upstream-sync@users.noreply.github.com"
          set +e
          bash scripts/sync-upstream.sh
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Set up Node
        if: steps.sync.outputs.status == 'merged' || steps.sync.outputs.status == 'fast-forwarded'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify merged code builds and passes role checks
        id: verify
        if: steps.sync.outputs.status == 'merged' || steps.sync.outputs.status == 'fast-forwarded'
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test:roles

      - name: Push to fork (no force)
        id: push
        if: steps.verify.outcome == 'success'
        run: git push origin "HEAD:${TARGET_BRANCH}"

      - name: Write run summary
        if: always()
        env:
          STATUS: ${{ steps.sync.outputs.status || (steps.precheck.outputs.missing && 'missing-token') || 'failed' }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          NEW_COMMITS: ${{ steps.sync.outputs.new_upstream_commits }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          VERIFY: ${{ steps.verify.outcome }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          {
            echo "## Upstream sync: ${STATUS}"
            echo "- Upstream: \`${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH}\` ${UPSTREAM_SHA:0:7}"
            echo "- Fork branch: \`${TARGET_BRANCH}\`"
            [ -n "$NEW_COMMITS" ] && echo "- New upstream commits: ${NEW_COMMITS}"
            [ -n "$VERIFY" ] && [ "$VERIFY" != "skipped" ] && echo "- Build and role checks: ${VERIFY}"
            [ -n "$PUSH" ] && [ "$PUSH" != "skipped" ] && echo "- Push to fork: ${PUSH}"
            if [ -n "$CONFLICTS" ]; then
              echo "### Conflicting files"
              echo "$CONFLICTS" | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report problems or close the open report
        if: always()
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.sync.outputs.status || (steps.precheck.outputs.missing && 'missing-token') || 'failed' }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          VERIFY: ${{ steps.verify.outcome }}
          PUSH: ${{ steps.push.outcome }}
        with:
          script: |
            const { STATUS, UPSTREAM_SHA, CONFLICTS, VERIFY, PUSH,
                    UPSTREAM_REPOSITORY, UPSTREAM_BRANCH, TARGET_BRANCH } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'upstream-sync';
            const title = 'Upstream sync needs attention';
            const short = (UPSTREAM_SHA || '').slice(0, 7);

            const ok = ['up-to-date', 'fast-forwarded', 'merged'].includes(STATUS)
                       && VERIFY !== 'failure' && PUSH !== 'failure';

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 10,
            });

            if (ok) {
              for (const issue of open) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                  body: `Resolved: sync succeeded (${STATUS}, upstream ${short}). [Run](${runUrl})` });
                await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }

            let reason;
            if (STATUS === 'conflict') {
              const files = (CONFLICTS || '').split('\n').filter(Boolean).map(f => `- \`${f}\``).join('\n');
              reason = [
                `Upstream \`${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH}\` (${short}) conflicts with changes in this fork.`,
                'Nothing was merged or pushed; your work is untouched.',
                '', '**Conflicting files**', files, '',
                '**To resolve**', '```',
                `git fetch upstream ${UPSTREAM_BRANCH}`,
                `git checkout ${TARGET_BRANCH}`,
                `git merge upstream/${UPSTREAM_BRANCH}   # fix the files above, then:`,
                'git add <files> && git commit',
                `git push origin ${TARGET_BRANCH}`, '```',
                'The next scheduled run will confirm and close this issue.',
              ].join('\n');
            } else if (VERIFY === 'failure') {
              reason = `Upstream ${short} merged cleanly, but the build or role checks failed, so it was **not** pushed. Production is unchanged.`;
            } else if (PUSH === 'failure') {
              reason = `The merge built successfully but pushing to \`${TARGET_BRANCH}\` was rejected (the branch probably moved). The next run will retry.`;
            } else if (STATUS === 'missing-token') {
              reason = 'Secret `UPSTREAM_REPO_TOKEN` is not set, so the private upstream repository cannot be read.';
            } else if (STATUS === 'fetch-failed') {
              reason = '`UPSTREAM_REPO_TOKEN` could not read the upstream repository. It may have expired or lack Contents: read access.';
            } else {
              reason = 'The sync job failed unexpectedly.';
            }
            const body = `${reason}\n\n[Workflow run](${runUrl})`;

            if (open.length) {
              const last = (await github.rest.issues.listComments({ ...context.repo,
                issue_number: open[0].number, per_page: 100 })).data.pop();
              const previous = last ? last.body : open[0].body;
              if (!previous.startsWith(reason.split('\n')[0])) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
              }
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            }
            core.setFailed(reason.split('\n')[0]);
