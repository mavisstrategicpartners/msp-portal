name: Secret scan

# Blocks pushes and pull requests that add passwords, API keys or tokens.
# Scans the changes in each push; run it manually for a full-history scan.

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ./gitleaks git --redact --verbose --config .gitleaks.toml .
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}" .
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then RANGE="-1"; else RANGE="$BEFORE..${{ github.sha }}"; fi
            ./gitleaks git --redact --verbose --config .gitleaks.toml --log-opts="$RANGE" .
          fi
